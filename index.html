<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>電脳都市 - 迷路で守って、株で勝つ</title>
<meta name="description" content="タイルで迷路を作ってウイルスの波を全員で守りきり、育てた会社の株で一番のお金持ちを目指す。株ゲーム×タワーディフェンス。CPUと、またはスマホ同士で2〜6人">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="電脳都市 - 迷路で守って、株で勝つ">
<meta property="og:description" content="タイルで迷路を作ってウイルスの波を全員で守りきり、育てた会社の株で一番のお金持ちを目指す。株ゲーム×タワーディフェンス。CPUと、またはスマホ同士で2〜6人">
<meta property="og:url" content="https://kyunkyunpeachdisco-maker.github.io/stock-defense/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kyunkyunpeachdisco-maker.github.io/stock-defense/icons/ogp.png">

<style>
  :root { --bg:#05070d; --panel:#0c1222; --line:#1d2a48; --text:#e6ecff; --dim:#8b97b8; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  body { min-height:100dvh; display:flex; flex-direction:column; align-items:center; }
  #wrap { width:100%; max-width:560px; padding:6px; }
  html, body { overflow-x:hidden; }   /* どれかが長くなっても、ページの幅は画面の幅のまま */
  #top { min-width:0; }
  #top #wave { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:0 1 auto; }
  #top #life, #top #money { flex:none; }
  .tile { overflow:hidden; }
  @media (max-width:360px) { .tile .nm { font-size:11px; letter-spacing:-.6px; } .tile .eff, .tile .tm { font-size:10px; } }
  #top { display:flex; gap:8px; align-items:center; font-size:13px; flex-wrap:wrap; padding:4px 2px; }
  #top .big { font-size:16px; font-weight:bold; white-space:nowrap; }
  /* スマホ：1行目に波（と持ち時間）とボタン、2行目にライフと所持金（1行だと波の表示が押し出されて消えていた） */
  #top .brk { display:none; }
  @media (max-width:480px) { #top { flex-wrap:wrap; gap:2px 6px; } #top #wave { flex:1 1 0; } #top .btn { order:1; } #top .brk { display:block; flex-basis:100%; height:0; order:2; } #top #life { order:3; } #top #money { order:4; } #top .big { font-size:14px; } #setupNote { display:none; } #helpBtn .hl { display:none; } #top .btn { white-space:nowrap; }
    /* スマホ：縦に長くならないよう、手札・ボタン・株の場を詰める */
    .tile { min-width:0; flex:1 1 30%; padding:3px 5px; font-size:11px; } .tile b { font-size:13px; } .tile img { width:18px !important; height:18px !important; }
    #acts .btn { padding:5px 8px; font-size:12px; } #market .btn { padding:4px 7px; font-size:12px; }
    #turn { padding:4px 6px; } #turn .sub { font-size:11px; } table { font-size:11px; } th, td { padding:2px 3px; } }
  #life { color:#ff6b8b; } #wave { color:#7cf9ff; } #money { color:#ffe066; }
  canvas { display:block; width:100%; touch-action:manipulation; background:radial-gradient(circle at 50% 45%, #0b1430, #04060c 70%); border-radius:8px; }
  #track { position:relative; height:30px; margin:6px 0 2px; background:var(--panel); border-radius:6px; overflow:hidden; }
  #track .mk { position:absolute; top:4px; height:22px; min-width:22px; padding:0 5px; border-radius:11px; font-size:11px; line-height:22px; text-align:center; color:#000; font-weight:bold; transition:left .3s; }
  #turn { font-size:14px; padding:4px 2px; min-height:24px; }
  #hand { display:flex; gap:5px; flex-wrap:wrap; padding:4px 0; }
  .tile { border:2px solid #2c3d6b; border-radius:8px; padding:4px 6px; font-size:12px; background:#0a0f1d; color:var(--text); cursor:pointer; min-width:96px; text-align:left; white-space:nowrap; }
  .tile b { font-size:15px; display:block; }
  /* 札：タワーの印と名前を大きく、エリアは右上の小さな印 */
  .tile { position:relative; }
  .tile .ar { float:right; font-size:11px; font-weight:bold; color:#05070d; background:#9fb0dd; border-radius:9px; padding:0 6px; line-height:17px; }
  .tile .nm { display:flex; align-items:center; gap:3px; font-size:12px; font-weight:bold; white-space:nowrap; letter-spacing:-.5px; }
  .tile .nm img { width:17px; height:17px; flex:none; }
  .tile .pf { margin-left:4px; font-size:10px; color:#ff9a9a; }
  .tile .tm { display:block; font-size:11px; color:var(--dim); }
  /* 盤の上のメニュー（タワーディフェンスのように、押したマスのそばに出す） */
  #bmenu { position:absolute; z-index:5; display:none; background:#0c1630f2; border:2px solid #7cf9ff; border-radius:12px; padding:6px; box-shadow:0 0 16px #7cf9ff88; min-width:150px; max-width:230px; }
  #bmenu .mh { font-size:12px; color:var(--dim); padding:0 22px 4px 2px; }
  #bmenu .mi { display:flex; align-items:center; gap:6px; width:100%; margin:3px 0; padding:7px 8px; font-size:14px; text-align:left; background:#16213d; color:var(--text); border:1px solid #2c3d6b; border-radius:8px; }
  #bmenu .mi img { width:20px; height:20px; }
  #bmenu .mi .t { margin-left:auto; font-size:12px; color:var(--dim); }
  #bmenu .mi:disabled { opacity:.45; }
  #bmenu .x { position:absolute; top:2px; right:6px; background:none; border:none; color:var(--dim); font-size:18px; }
  .tile .eff { display:block; color:#ffe9a8; font-size:11px; white-space:normal; line-height:1.3; margin:1px 0; }
  .tile.sel { background:#1c2b52; border-color:#7cf9ff; box-shadow:0 0 10px #7cf9ff; }
  .tile.bad { opacity:.35; }
  button { font-size:16px; }
  .btn { background:#16213d; color:var(--text); border:1px solid #2c3d6b; border-radius:8px; padding:7px 10px; font-size:14px; cursor:pointer; }
  .shead { width:100%; font-size:12px; color:#9fb0dd; margin:2px 0 4px; }
  .sgrid { width:100%; display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; }
  .sgrid .btn { padding:5px 2px; font-size:13px; line-height:1.3; min-height:50px; }
  .sgrid .btn .note { font-size:11px; }
  .peek { display:flex; flex-wrap:wrap; gap:4px; }
  .peek span { border:1px solid #2c3d6b; border-radius:6px; padding:2px 6px; font-size:12px; color:var(--text); background:#0c1222; }
  .peek small { margin-left:4px; color:var(--dim); font-size:10px; }
  .sgrid .btn .pw { font-size:10px; letter-spacing:-.4px; line-height:1.25; color:#ffe9a8; }
  #market .btn.on { background:#24407a; box-shadow:0 0 8px #7cf9ff; }
  .btn:disabled { opacity:.35; cursor:default; }
  #acts { display:flex; gap:6px; flex-wrap:wrap; padding:4px 0; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { padding:3px 4px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  td .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  #log { font-size:12px; color:var(--dim); max-height:110px; overflow:auto; padding:4px 2px; border-top:1px solid var(--line); margin-top:6px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:9; }
  #modal .box { background:var(--panel); border:1px solid #2c3d6b; border-radius:12px; padding:16px; max-width:92%; width:380px; }
  #modal h3 { margin:0 0 8px; font-size:17px; }
  #modal .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .note { font-size:12px; color:var(--dim); }
  /* 説明まわり */
  #soundBtn { margin-left:auto; }
  #helpBtn { padding:4px 10px; font-size:13px; }
  #turn { background:#101a33; border:1px solid #2c3d6b; border-radius:8px; padding:6px 8px; margin:4px 0; line-height:1.5; }
  #turn .now { color:#7cf9ff; font-weight:bold; }
  #turn .sub { display:block; font-size:12px; color:var(--dim); }
  .sec { font-size:12px; color:#9fb0dd; margin:6px 0 0; font-weight:bold; }
  /* スマホ：盤と手番の説明の下は、タブ（操作・会社・記録）で切り替え。操作のタブには、今の手順に要るものだけ出す */
  #tabs { display:none; gap:4px; margin:4px 0 2px; }
  #tabs .btn { flex:1; padding:5px 0; font-size:13px; }
  #tabs .btn.on { background:#24407a; border-color:#7cf9ff; }
  @media (max-width:680px) { #tabs { display:flex; } .grp.hide { display:none; }
    /* 手札は3枚ずつ2段で、6枚とも見えるように。置く・強化は盤の上のメニューで行うので、下の「置く」は出さない */
    #hand { gap:4px; }
    #hand .tile { flex:0 0 calc((100% - 8px) / 3); min-width:0; padding:3px 4px; }
    #place { display:none !important; } }
  .sec .q { color:var(--dim); font-weight:normal; cursor:help; border-bottom:1px dotted var(--dim); margin-left:4px; }
  [data-tip] { cursor:help; }
  #tip { position:fixed; z-index:20; max-width:280px; background:#18254a; border:1px solid #4d6bb3; color:var(--text); font-size:12px; line-height:1.5; padding:6px 8px; border-radius:6px; pointer-events:none; display:none; }
  .glow { animation:glow 1s ease-in-out infinite alternate; position:relative; z-index:2; }
  @keyframes glow { from { box-shadow:0 0 0 2px #7cf9ff88; } to { box-shadow:0 0 14px 4px #7cf9ffee; } }
  #modal .box { max-height:88dvh; overflow:auto; }
  #modal .box h4 { margin:12px 0 4px; font-size:14px; color:#7cf9ff; }
  #modal .box p, #modal .box li { font-size:13px; line-height:1.6; margin:2px 0; }
  #modal .box ul { padding-left:18px; margin:2px 0; }
  .pick { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0; }
  #mbox .btn.on { background:#24407a; border-color:#7cf9ff; box-shadow:0 0 8px #7cf9ff66; }
  .pick .btn.on { background:#24407a; border-color:#7cf9ff; }
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <span id="wave" class="big" data-tip="敵の波。全部の回数は上に出ています。波と波の間は少しだけ時間があります"></span>
    <span id="life" class="big" data-tip="全員で共有のライフ。敵が出口（中枢サーバー）に届くと減り、0になると全員の負け"></span>
    <span id="money" class="big" data-tip="株を公開するときに払うお金。終わりにいちばん多い人の勝ち"></span>
    <span class="note" id="setupNote"></span>
    <span class="brk"></span>
    <button class="btn" id="pauseBtn" style="padding:4px 8px;font-size:13px;display:none" data-tip="一時停止（ひとりで遊ぶときだけ）">⏸</button>
    <button class="btn" id="ffBtn" style="padding:4px 8px;font-size:13px;display:none" data-tip="早回し（ひとりで遊ぶときだけ）。押すたびに 1倍 → 2倍 → 3倍。持ち時間（秒）は早回ししても本当の秒で減る">▶</button>
    <button class="btn" id="soundBtn" style="padding:4px 8px;font-size:13px" data-tip="効果音を鳴らす・消す"></button>
    <button class="btn" id="helpBtn">？<span class="hl"> ルール</span></button>
  </div>
  <div style="position:relative"><canvas id="cv"></canvas><div id="bmenu"></div></div>
  <div id="turn"></div>
  <div id="info" class="note" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:2px 2px 4px"></div>
  <div id="tabs"><button class="btn on" data-tab="op">操作</button><button class="btn" data-tab="cos">会社</button><button class="btn" data-tab="log">記録</button></div>
  <div class="grp" id="gTrack">
  <div class="sec">時間トラック<span class="q" data-tip="手番の順番を決める線です。いちばん左（後ろ）の人が次に動きます。行動するとその時間だけ右へ進みます。ピンクの線がこの波で使える時間の終わりで、越えた人は波が終わるまで待ちます。越えた分は次に持ち越します。">？</span></div>
  <div id="track"></div>
  </div>
  <div class="grp" id="gHand">
  <div class="sec">タイルの手札<span class="q" data-tip="タイルにはエリア（盤のうすい文字 A〜F）と種類が書いてあります。そのエリアの空いているマスなら、どこにでも置けます。選ぶと盤の上で置ける場所が光ります。置くとそこは壁になり、種類によっては敵を撃つタワーになります。置くのは無料で、時間だけ使います。">？</span></div>
  <div id="hand"></div>
  <div id="acts">
    <button class="btn" id="place" disabled>このタイルを置く</button>
    <button class="btn" id="swap">タイルを捨てて引き直す（時間1）</button>
    <button class="btn" id="renewBtn" style="display:none"></button>
    <button class="btn" id="removeBtn" style="display:none">取り除く（時間2）</button>
  </div>
  </div>
  <div class="grp" id="gStock">
  <div class="sec">株<span class="q" data-tip="タイルを置くか強化すると、株を1枚手札に入れます（場の5枚・山札の一番上・投資信託から選ぶ）。手札の株はまだ数えません。お金を払って公開した株だけが、ボーナスと売却で数えられます。">？</span></div>
  <div id="market" style="padding:4px 0"></div>
  </div>
  <div class="grp" id="gCos">
  <div class="sec">会社<span class="q" data-tip="つながったタイルのかたまり（2枚以上）に会社が付きます。株価は、その会社のタワーが倒した敵の数で上がります。会社どうしがつながると合併し、吸収された会社の株主にボーナスが出ます。">？</span></div>
  <table id="cos"></table>
  </div>
  <div class="grp" id="gLog"><div id="log"></div></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="pauseOv" style="position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20"><div style="font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 12px #33f0ff">一時停止中</div><button class="btn" id="resumeBtn" style="font-size:18px;padding:10px 28px">再開する</button></div>
<button class="btn" id="backChoice" style="display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:8;box-shadow:0 0 12px #7cf9ff;border-color:#7cf9ff"></button>
<div id="tip"></div>
<script>
'use strict';
// ===== 定数（ルール案 v0.9。数字は仮で、遊んで見直す） =====
const COLS = 12, ROWS = 13;
const ROWNAME = 'ABCDEFGHIJKLM';
const PARAMS = new URLSearchParams(location.search);
const AUTO = PARAMS.has('auto');                 // 全員 CPU（動作確認用）
// 次の波までの秒数：人が遊ぶときは長め（最初90秒・あとは敵が出きってから45秒）。全員 CPU の試しは 60秒・30秒のまま（難しさはこれで合わせた）
const FIRST_WAIT = AUTO ? 60 : 90, WAVE_GAP = AUTO ? 30 : 45;
const SPEED = +(PARAMS.get('speed') || 1);       // 時間の進みを速める（動作確認用）
// 区切り（使える時間が補充されるとき）：波が始まるとき（start）か、波が終わったとき（end）か。試して決める
const CYCLE = PARAMS.get('cycle') === 'start' ? 'start' : 'end';  // CPU で比べて「波が終わったとき」に決めた
const MARKET = 5;
// 投資信託：取り方と交換はユニオン・パシフィック株にならう（20枚）。筆頭も順位の配当もない。
// 儲けは、終わりにそのときの値段で売る（解約）ことだけ
// 株の枚数：ユニオン・パシフィックのように会社ごとに違う（格の高い会社ほど多い）。合計130枚（ユーザー）。
// 98枚では売り切れたので増やした。投資信託は、ユニオン・パシフィックと同じく全体の約17%で26口。
// 比べるために ?shares=acquire でアクワイアどおり（1社25枚、投資信託35口）にもできる
const SHARE_MODE = PARAMS.get('shares') === 'acquire' ? 'acquire' : 'up';
// ユニオン・パシフィックでは大きくなれる会社ほど株が多い（いちばん大きい EP&RG が18枚、いちばん小さい灰が6枚）。
// それにならい、格の高い会社ほど多くした（前は逆で、格の高い会社が少ない枚数で筆頭になれて得すぎた）。?shares=old で前の配分
const SHARES_BY_CO = SHARE_MODE === 'up' ? (PARAMS.get('shares') === 'old' ? [26, 24, 22, 18, 16, 14, 10] : [10, 14, 16, 18, 22, 24, 26]) : [25, 25, 25, 25, 25, 25, 25];
const CENTRAL = 7, CENTRAL_CARDS = SHARE_MODE === 'up' ? 26 : 35;
const CENTRAL_CO = { id:CENTRAL, name:'投資信託', tier:0, color:'#ff4dff', active:true, central:true };
const coOf = id => id === CENTRAL ? CENTRAL_CO : G.cos[id];
// 投資信託の株価：盤にある会社の株価の加重平均（S&P のように、時価総額＝株価×公開されている株の枚数で重みをつける）。
// 公開された株がまだなければ、会社の株価をそのまま平均する。100単位に丸める
const centralPrice = () => {
  const act = G.cos.filter(c => c.active);
  if (!act.length) return 200;
  const w = act.map(c => G.players.reduce((s2, q) => s2 + q.shares[c.id], 0)), sw = w.reduce((a, b) => a + b, 0);
  const avg = sw ? act.reduce((s2, c, i) => s2 + price(c) * w[i], 0) / sw : act.reduce((s2, c) => s2 + price(c), 0) / act.length;
  return Math.max(100, Math.round(avg / 100) * 100);
};
const priceOf = id => id === CENTRAL ? centralPrice() : price(G.cos[id]);  // 場に表向きに並べる株券の枚数（ユニオン・パシフィック式）
const CPU_LEVELS = ['strong', 'normal', 'easy'];
let CPU_LEVEL = CPU_LEVELS.includes(PARAMS.get('level')) ? PARAMS.get('level') : 'normal';
// 難しさ（人が遊ぶとき用）：敵の体力の倍率と、最初の3波をさらに柔らかくするか。CPU の試しで合わせた硬さが「ふつう」
const DIFFS = { easy:{ name:'やさしい', hp:.8, early:.7 }, normal:{ name:'ふつう', hp:1 }, hard:{ name:'むずかしい', hp:1.15 } };
let DIFF = DIFFS[PARAMS.get('diff')] ? PARAMS.get('diff') : 'normal';
let NO_LIMIT = PARAMS.get('limit') === '0';   // 考える時間なし（人が遊ぶとき、自分の番の考える時間が減らない）
let NPLAYERS = Math.max(2, Math.min(6, +(PARAMS.get('players') || 4)));

// タイルの種類：時間・射程（マス）・威力・撃つ間隔（秒）・色
const TYPES = {
  node:  { name:'ノード',           time:1, color:'#c9d4ff', range:1.2, dmg:.4, cd:.5 },
  av:    { name:'アンチウイルス',   time:2, color:'#33f0ff', range:1.6, dmg:1, cd:.35 },
  fw:    { name:'ファイアウォール', time:3, color:'#ff9a3c', range:1.8, dmg:0, cd:.5, slow:.45 },
  scan:  { name:'スキャナー',       time:4, color:'#ff4dd8', range:3.2, dmg:5, cd:1.6 },
  burst: { name:'一斉駆除',         time:5, color:'#ffe14d', range:2.2, dmg:2, cd:1.4, splash:.9 },
  // 誘導（ユーザーの案）：射程に入った敵の一部をおびき寄せ、自分の前まで寄り道させる。数字は Claude の案
  lure:  { name:'ハニーポット',     time:3, color:'#ffd27a', range:2.2, dmg:0, cd:.3, cap:2, chance:.3 },
  // ボルテックス（ユーザーの案。GeoDefense の Vortex タワーから）：撃たない。とても広い射程の中で倒れた敵の火花を吸い取り、
  // 同じ会社の攻撃するタワー全部に同じ速さで送る。満タンになったタワーは、次の1発が必殺弾になる（自動）。数字は CPU の試しで合わせる
  vortex:{ name:'ボルテックス',     time:3, color:'#b48cff', range:4, dmg:0, cd:1 },
};
// ボルテックスの数字：1体倒れるとたまる量（大きい敵は多め）、満タンの量、必殺弾の威力の倍率とまわりに当たる広さ。

function refillMarket() {
  for (;;) {
    while (G.market.length < MARKET && (G.deck.length || (G.discards && G.discards.length))) G.market.push(drawDeck());

    const co = G.cos[G.market[0]];
    G.removed = (G.removed || 0) + G.market.length; G.market = [];

// ===== 行動 =====
// 区切り：線を越えて進んでいた分は、そのまま引き継ぐ。

function newCycle() {

  behind.forEach((p, i) => { p.t = base; p.order = 1e9 - i; });  // 線ちょうどにいた人より先に動く
  G.players.forEach(p => { p.resetUsed = false; p.clock = WAVE_GAP; });
  G.limit = base + budget();

}
function nextActor() {
  // 時間トラックでいちばん後ろの人。同じなら、あとからその位置に来た人が先（テーベと同じ）。
  // この波で使える時間を使い切った人は、次の波まで動けない
  const ready = G.players.filter(p => p.t < G.limit);

// 手柄の分け方（?credit=dmg で、その敵を削った量の割合で分ける。試し中。ふつうはとどめを刺したタワー）
const CREDIT_DMG = PARAMS.get('credit') === 'dmg';

// 2人のときだけ：タイルを置いたあと、任意で手札のタイルを1枚入れ替えられる（ユーザー）。入れ替えたタイルは山の底へ。

// 強化：盤の上のどのタイルでも（タイルは誰のものでもない）。時間は置いたときと同じ。3段階まで。ノードは撃たないので強化しない
const canUpgrade = t => t && TYPES[t.type].range > 0 && t.type !== 'node' && t.lv < 3;
// タイルを取り除く（?remove=1 でプレイヤーの行動、?worm=1 で敵のワームが壊す。どちらも試し中）。

function removeTile(k, why) {

const canRemove = k => REMOVE && !!G.tiles[k];

  { const ut = G.stats.upgBy = G.stats.upgBy || {}; ut[t.type] = (ut[t.type] || 0) + 1; } p.resetUsed = false;
  log(`${p.name}：${label(t.x, t.y)} の${TYPES[t.type].name}を強化（段階${t.lv}、時間${TYPES[t.type].time}）`);

function resolveGroup(p, x, y, onDone) {

  if (cos.length === 0) {
    if (grp.length >= 2) {
      const free = G.cos.filter(c => !c.active);
      if (!free.length) return onDone();
      const found = id => { foundCompany(p, id, grp); onDone(); };
      // CPU の設立：手札と公開した株の多い会社を選び、同じならくじ。前は同じなら★の多い会社で、序盤はヘリオス・オメガばかり立っていた（?found=tier で前の形）

// 記録：誰に、何の種類で、いくら入ったか
function earn(p, kind, v) { if (!p || !v) return; p.income = p.income || {}; p.income[kind] = (p.income[kind] || 0) + v; }
function bonuses(co, m1 = 10, m2 = 5, kind = null, label = 'ボーナス') {

  const pr = price(co);
  const holders = G.players.map(p => ({ p, n:p.shares[co.id] })).filter(h => h.n > 0);
  if (NPLAYERS === 2) holders.push({ p:null, n:1 + rnd(6) });
  if (!holders.length) return;
  holders.sort((a, b) => b.n - a.n);
  const pay = (list, amount) => { const each = Math.ceil(amount / list.length / 100) * 100; list.forEach(h => { if (h.p) { h.p.money += each; earn(h.p, kind || (G.over ? '終わりのボーナス' : '合併のボーナス'), each); } }); return each; };
  const first = holders.filter(h => h.n === holders[0].n);
  if (holders.length === 1 || first.length > 1) {

    log(`${co.name}の${label}：${first.map(h => h.p ? h.p.name : '市場').join('・')} に各${each}`);
    return;
  }
  pay(first, pr * m1);

  const second = rest.filter(h => h.n === rest[0].n);

}

// 合併の株の扱いを、組み合わせを比べて決める（?disp=mix で偶数番だけ、?disp=0 でなし。比べる用）

    log(`合併：${sv.name}が${co.name}を吸収`); G.stats.merges++;
    const moneyBefore = G.players.map(q => q.money), sizes = [coSize(id), coSize(survivor)];
    { const c = centroid(id); if (c) { shock(c[0], c[1], 3.5); burst(c[0], c[1], co.color, 90, 2.6); floatText(c[0], c[1], `合併：${sv.name}が${co.name}を吸収`, sv.color); } G.flash[id] = 1.4; G.flash[survivor] = 1.4; announce('合併', `${sv.name} ← ${co.name}`); sfx('merge'); shake(12); }

const WAIT_LIMIT = 10;   // 建設待ちは10秒まで（ゲームの中の秒）

function act(pid, a) {

      if (spotsOf(t).every(([x, y]) => x !== a.at[0] || y !== a.at[1])) return false;

    case 'place': {

      G.busy = true; placeTile(p, a.idx, () => takeStep(p, afterAction), a.at); return true;
    }
    case 'upgrade': if (!turn || !canUpgrade(G.tiles[a.k])) return false; G.busy = true; upgradeTile(p, a.k); takeStep(p, afterAction); return true;
    case 'remove': if (!turn || !canRemove(a.k)) return false; G.busy = true; removeAction(p, a.k); afterAction(); return true;
    case 'reveal': if (!turn || !(a.n >= 1) || !canReveal(p, a.id, a.n)) return false; G.busy = true; revealShares(p, a.id, a.n); afterAction(); return true;
    case 'pair': if (!turn || !canRevealPair(p, a.a, a.b)) return false; G.busy = true; revealPair(p, a.a, a.b); afterAction(); return true;
    case 'renew': {   // 印が埋まったタイルを全部入れ替える（時間1）
      const idxs = p.hand.map((t, i) => printedFilled(t) ? i : -1).filter(i => i >= 0);
      if (!turn || !idxs.length) return false;
      renewTiles(p, idxs); spend(p, 1); log(`${p.name}：印が使えないタイルを${idxs.length}枚入れ替えた（時間1）`); G.stats.renew = (G.stats.renew || 0) + 1; afterAction(); return true;
    }
    case 'redraw': if (!turn || canDoSomething(p) || !p.hand[a.idx || 0]) return false; swapTile(p, a.idx || 0); afterAction(); return true;
    case 'take': if (!G.taking || G.taking.p !== p || ![-2, -1, 0, 1, 2, 3, 4].includes(a.mi)) return false; finishTake(a.mi); return true;
    case 'exchange': if (!G.exchanging || G.exchanging.p !== p || (a.id !== null && !p.cards.includes(a.id))) return false; finishExchange(a.id); return true;
    case 'discard': if (!G.discarding || G.discarding.p !== p || !p.cards.includes(a.id)) return false; finishDiscard(a.id); return true;
    case 'swap': if (!G.swapping || G.swapping.p !== p || (a.idx !== null && !p.hand[a.idx])) return false; finishSwap(a.idx); return true;
    case 'reset': if (!G.taking || G.taking.p !== p || !canReset(p)) return false; resetMarket(); p.resetUsed = true; renderAll(); return true;
    case 'choose': {

      G.choosing = null; shownChoice = 0; hideModal(); c.cb(a.v); return true;
    }
  }
  return false;
}

function chooseDisposal(p, co, sv, pr, n, maxPairs, cb) {

}

const RULES_HTML = () => `<h3>電脳都市のルール（まとめ）</h3>${POWERS ? `<h4>会社の能力</h4><p class="note">能力はその会社のタワー全部に効きます。吸収された会社の能力は消えます。</p><ul>${POWER.map((w, i) => `<li>${COMPANIES[i].name}（${w.name}）：${w.desc}</li>`).join('')}</ul>` : ''}
<h4>目的</h4><p>ウイルス（敵）の波を全員で${WAVES}回守りきり、そのとき<b>いちばんお金の多い人</b>の勝ち。ライフが0になったら<b>全員の負け</b>。</p>
<h4>手番の順番</h4><p>時間トラックで<b>いちばん後ろの人</b>が次に動く。行動するとその時間だけ前へ進む。1つの波で1人が使える時間は、全員の合計が24になるように人数で決まる（4人なら6、2人なら12、6人なら4）。<b>最初の波の前だけは2倍</b>。使い切ったら波が終わるまで待つ。開始画面で「持ち時間：あり」を選んだときは、波ごとに一人ひとりに持ち時間（最初の波の前は90秒、あとは45秒）がある。自分の番の間だけ減り、なくなったらその波の残りの手番は飛ばす。全員の手番が終わって敵がいなくなったら、次の波が来る。</p>
<h4>手番でできること（どれか1つ）</h4><ul>
<li><b>タイルを置く</b>：手札のタイルには<b>印のマス</b>（盤に点線で出る）と、そのマスのエリアが書いてある。${CELL_EXTRA ? `<b>同じエリアの空いているマス</b>なら、札の時間で置ける。<b>印のマスに置けば時間が${CELL_EXTRA}少ない</b>` : 'そのエリアの空いているマスならどこにでも置ける'}（盤のうすい文字 A〜F がエリア）。盤の光るマスを押すと、そこに置けるタイルが並ぶ。置いたマスは壁になり、敵はよけて進む（遠回りさせるほど守りやすい）。入口から出口への道をふさぐ置き方はできない。置いたら<b>株を1枚手札に入れる</b>。<b>2人のときだけ</b>、置いたあとに手札のタイルを1枚入れ替えてもよい（入れ替えたタイルは山の底へ）。</li>

<li>どれもできないときだけ、タイルを1枚捨てて引き直す（時間1）。</li></ul>
<h4>色とマーク</h4><p>タイルの<b>色は会社</b>（灰色は会社のないタイル）。<b>黄色の点線に「印」</b>は、あなたの手札のタイルの印のマス（まだ置いていない）。<b>マークはタワーの種類</b>。撃つ光線も会社の色。</p>
<ul>${Object.keys(TYPES).map(k => `<li><img src="${iconUrl(k)}" alt="" style="width:18px;height:18px;vertical-align:-4px;background:#16213d;border-radius:4px"> <b>${TYPES[k].name}</b>：${TYPE_DESC[k]}</li>`).join('')}</ul>

const tipEl = document.getElementById('tip');

function showTip(el) {

  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;

// ===== 何人かで遊ぶ（PeerJS。ホストが計算し、参加者には様子を送る。テンプレートの「端末間同期」の手順どおり） =====
const NET_PREFIX = 'denno-toshi-', ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // O/0/I/1 を除いた32文字

const pendPid = x => x ? x.p.id : -1;
// 参加者1人ぶんの様子（手札はその人のものだけ）
function snapshot(seat) {

    cos:G.cos.map(c => [c.active ? 1 : 0, c.kills]),
    players:G.players.map(o => ({ name:o.name, color:o.color, money:o.money, shares:o.shares, t:o.t, order:o.order, cpu:o.cpu, resetUsed:o.resetUsed, clock:o.clock })),
    hand:q.hand, cards:q.cards, market:G.market, avail:G.cos.map(c => availOf(c.id)), centralLeft:G.centralLeft,
    lives:G.lives, wave:G.wave, waveTimer:G.waveTimer, sq:G.spawnQueue.length, limit:G.limit, actor:G.actor ? G.actor.id : -1, busy:G.busy,
    enemies:G.enemies.map(e => [e.id, e.type, e.x / S, e.y / S, e.hp, e.max, e.cell, e.next, e.lure || null]),
    beams:G.beams.map(b => b.ring ? [1, b.x / S, b.y / S, b.r / S, b.color, b.life] : [0, b.x1 / S, b.y1 / S, b.x2 / S, b.y2 / S, b.color, b.life, b.w]),

    pend:{ taking:pendPid(G.taking), exchanging:pendPid(G.exchanging), discarding:pendPid(G.discarding), swapping:pendPid(G.swapping),

function netHostTick(dt) {

// 参加者：届いた様子を写す
let lastTileCount = -1;
function applyState(m) {
  G.tiles = {}; m.tiles.forEach(([x, y, type, lv]) => G.tiles[key(x, y)] = { type, x, y, lv, cool:0 });
  if (m.tiles.length !== lastTileCount) { lastTileCount = m.tiles.length; G.dist = distanceField(); }
  G.owner = m.owner; m.cos.forEach(([a, k], i) => { G.cos[i].active = !!a; G.cos[i].kills = k; });
  m.players.forEach((o, i) => Object.assign(G.players[i], o));
  me().hand = m.hand; me().cards = m.cards;
  G.market = m.market; G.availNet = m.avail; G.centralLeft = m.centralLeft;
  G.lives = m.lives; G.wave = m.wave; G.waveTimer = m.waveTimer; G.spawnQueue = Array(m.sq).fill('normal'); G.limit = m.limit; G.busy = m.busy;
  G.actor = m.actor >= 0 ? G.players[m.actor] : null;
  const old = new Map(G.enemies.map(e => [e.id, e]));
  G.enemies = m.enemies.map(([id, type, x, y, hp, max, cell, next, lure]) => {
    const e = old.get(id) || { id, x:x * S, y:y * S };
    Object.assign(e, { type, hp, max, cell, next, lure, tx:x * S, ty:y * S }); return e;
  });
  G.beams = m.beams.map(b => b[0] ? { ring:true, x:b[1] * S, y:b[2] * S, r:b[3] * S, color:b[4], life:b[5] } : { x1:b[1] * S, y1:b[2] * S, x2:b[3] * S, y2:b[4] * S, color:b[5], life:b[6], w:b[7] });

  G.nextWave = m.nextWave; G.lastSettle = m.lastSettle;
  const pp = id => id >= 0 ? { p:G.players[id] } : null;
  G.taking = pp(m.pend.taking); G.exchanging = pp(m.pend.exchanging); G.discarding = pp(m.pend.discarding); G.swapping = pp(m.pend.swapping);
  G.choosing = m.pend.choosing ? { p:G.players[m.pend.choosing.pid], kind:m.pend.choosing.kind, data:m.pend.choosing.data, seq:m.pend.choosing.seq } : null;
  for (const [f, a] of m.fx) {
    if (f === 'burst') burst(a[0] * S, a[1] * S, a[2], a[3], a[4]);
    if (f === 'shock') shock(a[0] * S, a[1] * S, a[2]);
    if (f === 'text') floatText(a[0] * S, a[1] * S, a[2], a[3]);
    if (f === 'absorb') absorbFx(a[0] * S, a[1] * S, a[2] * S, a[3] * S);

// ホスト：部屋を作り、参加の申し込みを受ける
function hostLobby(n, hostName) {
  const room = Array.from({ length:4 }, () => ROOM_CHARS[rnd(ROOM_CHARS.length)]).join('');
  G.net = { role:'host', room, peers:{}, fx:[], syncT:0, joined:[], pending:[], hostName:hostName || 'ホスト', n };
  modal('<h3>部屋を作っています…</h3><p class="note">PeerJS（相手を見つける無料の仲介）につないでいます</p>', [['やめる', () => location.reload()]]);
  Promise.all([loadPeer(), loadQR()]).then(() => {
    const peer = new Peer(NET_PREFIX + room); G.net.peer = peer;
    peer.on('error', err => { if (err.type === 'unavailable-id') { peer.destroy(); hostLobby(n, hostName); } else modal(`<h3>つなげませんでした</h3><p class="note">${err.type}</p>`, [['戻る', () => location.reload()]]); });
    peer.on('open', () => drawLobby());
    peer.on('connection', hostConn);
  }).catch(() => modal('<h3>読み込めませんでした</h3><p class="note">インターネットにつながっているか確かめてください</p>', [['戻る', () => location.reload()]]));

// ホスト：参加者からのつなぎ。入る（始まる前）・戻る（合言葉つき）・行動・切れる
function hostConn(conn) {
  conn.on('data', d => {
    if (d.type === 'join' && !G.started) { G.net.pending.push({ conn, name:String(d.name || '参加者').slice(0, 12) }); drawLobby(); }
    if (d.type === 'rejoin' && G.started && G.net.keys && G.net.keys[d.seat] && G.net.keys[d.seat] === d.key) {
      const seat = +d.seat, q = G.players[seat];
      G.net.peers[seat] = conn; q.cpu = false; q.remote = true;
      conn.send({ type:'start', course:COURSE, n:NPLAYERS, powers:POWERS, diff:DIFF, noLimit:NO_LIMIT, seat, names:G.players.map(o => o.name), room:G.net.room, key:d.key });
      conn.send(snapshot(seat)); log(`${q.name} が戻った`); renderAll();
    }
    if (d.type === 'act' && G.started) { const seat = Object.entries(G.net.peers).find(([, c]) => c === conn); if (seat) act(+seat[0], d.a); }
  });

    const seat = Object.entries(G.net.peers).find(([, c]) => c === conn);
    if (seat && G.started) { const q = G.players[+seat[0]]; q.cpu = true; delete G.net.peers[seat[0]]; log(`${q.name} が抜けたので、戻るまで CPU が代わりに打つ`); }
    if (!G.started) { G.net.joined = G.net.joined.filter(j => j.conn !== conn); G.net.pending = G.net.pending.filter(j => j.conn !== conn); drawLobby(); }
  });
}
function drawLobby() {
  const nt = G.net, url = location.origin + location.pathname + '?room=' + nt.room;
  let qr = ''; try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q.createSvgTag(4, 0); } catch (e) {}
  const full = nt.joined.length + 1 >= nt.n;
  modal(`<h3>部屋 ${nt.room}</h3><div style="background:#fff;display:inline-block;padding:6px;border-radius:6px">${qr}</div>
    <p class="note">QR を読むか、「部屋に入る」で番号 <b>${nt.room}</b> を入れてもらう。${nt.n}人の部屋で、空いた席は CPU が入る</p>
    <h4>参加する人</h4><p>${[nt.hostName + '（ホスト）', ...nt.joined.map(j => j.name)].join('、')}</p>
    ${nt.pending.length ? '<h4>参加の申し込み</h4>' + nt.pending.map((j, i) => `<div style="margin:4px 0">${j.name} <button class="btn" data-ok="${i}" ${full ? 'disabled' : ''}>許可</button> <button class="btn" data-ng="${i}">断る</button></div>`).join('') : ''}`,
    [['はじめる', () => hostStart()], ['やめる', () => location.reload()]]);
  document.querySelectorAll('#mbox [data-ok]').forEach(b => b.onclick = () => { const j = nt.pending.splice(+b.dataset.ok, 1)[0]; nt.joined.push(j); drawLobby(); });
  document.querySelectorAll('#mbox [data-ng]').forEach(b => b.onclick = () => { const j = nt.pending.splice(+b.dataset.ng, 1)[0]; j.conn.send({ type:'reject' }); drawLobby(); });
}
function hostStart() {
  const nt = G.net; NPLAYERS = nt.n;
  nt.pending.forEach(j => j.conn.send({ type:'reject' })); nt.pending = [];
  startGame();
  G.players[0].name = nt.hostName;
  nt.joined.forEach((j, i) => { const seat = i + 1, q = G.players[seat]; q.cpu = false; q.remote = true; q.name = j.name; nt.peers[seat] = j.conn; });
  const names = G.players.map(q => q.name);
  nt.keys = {}; nt.joined.forEach((j, i) => nt.keys[i + 1] = Math.random().toString(36).slice(2, 10));
  nt.joined.forEach((j, i) => j.conn.send({ type:'start', course:COURSE, n:NPLAYERS, powers:POWERS, diff:DIFF, noLimit:NO_LIMIT, seat:i + 1, names, room:nt.room, key:nt.keys[i + 1] }));

// 参加者：部屋に入る
function joinRoom(room, name, back) {   // back：戻るときの { seat, key }
  room = String(room || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  modal(back ? `<h3>部屋 ${room} に戻っています…</h3><p class="note">ホストにつないでいます</p>` : `<h3>部屋 ${room} に入っています…</h3><p class="note">ホストの許可を待っています</p>`, [['やめる', () => { clearNetSave(); location.href = location.pathname; }]]);
  loadPeer().then(() => {
    const peer = new Peer();
    peer.on('error', err => { if (back && err.type === 'peer-unavailable') { peer.destroy(); return retryJoin(room, name, back); }   // ホストが部屋を開き直すのを待つ
      modal(`<h3>つなげませんでした</h3><p class="note">部屋番号が合っているか確かめてください（${err.type}）</p>`, [['戻る', () => location.reload()]]); });
    peer.on('open', () => {
      const conn = peer.connect(NET_PREFIX + room, { reliable:true });
      conn.on('open', () => conn.send(back ? { type:'rejoin', seat:back.seat, key:back.key } : { type:'join', name }));
      conn.on('data', d => {
        if (d.type === 'reject') modal('<h3>参加できませんでした</h3><p class="note">ホストに断られたか、もう始まっています</p>', [['戻る', () => location.reload()]]);
        if (d.type === 'start') {
          useCourse(d.course); NPLAYERS = d.n; POWERS = !!d.powers; DIFF = DIFFS[d.diff] ? d.diff : 'normal'; NO_LIMIT = !!d.noLimit; setup(); resize();
          G.viewer = d.seat; G.net = { role:'client', send:x => conn.send(x), fx:[] };
          G.players.forEach((q, i) => { q.name = d.names[i]; q.cpu = false; });
          G.started = true; hideModal(); renderAll(); renderLog(); retryCount = 0;
          if (d.key) { try { localStorage.setItem(NET_SAVE_KEY, JSON.stringify({ role:'client', room:d.room || room, seat:d.seat, key:d.key, name })); } catch (e) {} }
        }
        if (d.type === 'state' && G.started) applyState(d);
      });
      conn.on('close', () => {   // ホストが切れた：開き直すのを待って、つなぎ直す
        if (G.over) return;
        const sv = loadNetSave(); if (sv && sv.role === 'client') { peer.destroy(); retryJoin(sv.room, sv.name, sv); return; }
        modal('<h3>ホストとの接続が切れました</h3>', [['最初に戻る', () => location.href = location.pathname]]);
      });
    });
  }).catch(() => modal('<h3>読み込めませんでした</h3><p class="note">インターネットにつながっているか確かめてください</p>', [['戻る', () => location.reload()]]));
}
// 戻る：ホストが部屋を開き直すまで、3秒ごとに1分ほどつなぎ直す
let retryCount = 0;
function retryJoin(room, name, back) {
  if (++retryCount > 20) { modal('<h3>ホストに戻れませんでした</h3><p class="note">ホストが部屋を開き直していないかもしれません</p>', [['もう一度', () => { retryCount = 0; retryJoin(room, name, back); }], ['最初に戻る', () => { clearNetSave(); location.href = location.pathname; }]]); return; }
  modal(`<h3>ホストとつなぎ直しています…（${retryCount}回目）</h3><p class="note">ホストが部屋を開き直すと、自動でつながります</p>`, [['最初に戻る', () => { clearNetSave(); location.href = location.pathname; }]]);

function showJoin(room) {

// ===== ループ =====
let last = performance.now(), hudTimer = 0;
// 一時停止（ひとりで遊ぶときだけ。何人かで遊ぶときは、ほかの人の画面も止まるので出さない）
let paused = false;
const canPause = () => G.started && !G.over && !G.net && !AUTO;
// 早回し（ひとりで遊ぶときだけ）：ゲームの時間を2倍・3倍で進める
let FF = 1;
const drawFF = () => { const b = document.getElementById('ffBtn'); b.textContent = FF === 1 ? '▶' : '▶' + FF; b.style.color = FF > 1 ? '#ffe066' : ''; };
document.getElementById('ffBtn').onclick = () => { FF = FF % 3 + 1; drawFF(); };
function setPause(on) { paused = on && canPause(); document.getElementById('pauseOv').style.display = paused ? 'flex' : 'none'; }
document.getElementById('pauseBtn').onclick = () => setPause(true);
document.getElementById('resumeBtn').onclick = () => setPause(false);
document.addEventListener('visibilitychange', () => { if (document.hidden && canPause()) setPause(true); });   // ほかのアプリに切り替えたら止めておく
let saveTimer = 2;
function loop(now) {
  const dt = paused ? 0 : Math.min(.05, (now - last) / 1000) * SPEED * FF; last = now;   // 一時停止中は時間を進めない
  if (G.started) G.clock = (G.clock || 0) + dt;
  const client = G.net && G.net.role === 'client';
  for (let rest = G.started && !client ? dt : 0; rest > 1e-6; rest -= .05) {
    const h = Math.min(.05, rest);
    if (!G.over) { waveTick(h); enemyTick(h); towerTick(h); }
    turnTick(h);
  }
  if (client) for (const e of G.enemies) if (e.tx !== undefined) { const k = Math.min(1, dt * 12); e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k; }
  if (G.net && G.net.role === 'host' && G.started) netHostTick((now - (G.net.lastNow || now)) / 1000), G.net.lastNow = now;
  fxTick(dt);
  if (G.waitPlace && !G.over) {   // 建設待ち：置けるようになったら建てる。待っても置けない形になったらやめる
    const w = G.waitPlace, idx = w.p.hand.indexOf(w.t), r0 = idx >= 0 ? canPlaceAt(w.t, w.at[0], w.at[1]) : { ok:false };
    if (r0.ok) { G.waitPlace = null; G.busy = false; act(G.players.indexOf(w.p), { t:'place', idx, at:w.at }); }
    else if (!r0.wait) { G.waitPlace = null; G.busy = false; log(`${w.p.name}：${label(...w.at)} には置けなくなった（${r0.why || '手札にない'}）`); renderAll(); }
    else if ((G.clock || 0) > w.until) { G.waitPlace = null; G.busy = false; log(`${w.p.name}：${label(...w.at)} は敵が通り続けたので、建てるのをやめた`); renderAll(); }
  }

  hudTimer -= dt; if (G.started && hudTimer <= 0) { hudTimer = .25; renderTop(); renderInfo(); renderTurn(); if (G.actor === me()) renderHand(); }
  draw();

}
window.addEventListener('resize', () => { resize(); draw(); });
// 続きから遊ぶ：ひとりで遊ぶときだけ、波と波の間（敵がいなくて、選ぶ途中でもないとき）に、この端末に保存する
const SAVE_KEY = 'stock-defense-save';
const SAVE_FIELDS = ['tiles', 'owner', 'bag', 'later', 'players', 'cos', 'lives', 'wave', 'waveTimer', 'calib', 'waveLeaks', 'limit', 'roundOrder', 'deck', 'market', 'discards',
  'centralLeft', 'stats', 'seq', 'log', 'nextWave', 'lastSettle', 'planKey', 'planScore', 'clock', 'revLog', 'mergeLog', 'removed', 'wormNext'];

  const net = G.net && G.net.role === 'host' ? { room:G.net.room, hostName:G.net.hostName, keys:G.net.keys, remote:G.players.map(q => !!q.remote) } : null;   // ホストなら部屋の情報も
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v:1, at:Date.now(), course:COURSE, n:NPLAYERS, powers:POWERS, diff:DIFF, level:CPU_LEVEL, noLimit:NO_LIMIT, plan:[...PLAN], g, net })); } catch (e) {}

function loadSave() { try { const sv = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return sv && sv.v === 1 ? sv : null; } catch (e) { return null; } }

function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function resumeGame(sv) {
  useCourse(sv.course); NPLAYERS = sv.n; POWERS = !!sv.powers; DIFF = DIFFS[sv.diff] ? sv.diff : 'normal'; CPU_LEVEL = CPU_LEVELS.includes(sv.level) ? sv.level : 'normal'; NO_LIMIT = !!sv.noLimit;
  setup(); resize();
  Object.assign(G, sv.g); PLAN = new Set(sv.plan || []);
  G.dist = distanceField(); G.actor = null; G.busy = false; G.selected = null; G.menu = null;
  G.started = true; renderAll(); renderLog();
  log(`続きから：${sv.g.wave ? `波${sv.g.wave}のあと` : '最初の波の前'}から再開`);
  announce('続きから', `次は波 ${G.wave + 1}`);
}
// ホスト：保存したところから、同じ部屋番号で部屋を開き直す。参加者が戻るまでは CPU が代わりに打つ
function reopenHost(sv) {
  resumeGame(sv);
  G.players.forEach((q, i) => { if (sv.net.remote[i]) { q.remote = true; q.cpu = true; } });
  G.net = { role:'host', room:sv.net.room, peers:{}, fx:[], syncT:0, joined:[], pending:[], hostName:sv.net.hostName, n:NPLAYERS, keys:sv.net.keys || {} };
  let tries = 0;
  const open = () => loadPeer().then(() => {
    const peer = new Peer(NET_PREFIX + sv.net.room); G.net.peer = peer;
    peer.on('open', () => { hideModal(); log(`部屋 ${sv.net.room} を開き直した。参加者が戻るまで CPU が代わりに打つ`); });
    peer.on('error', err => { if (err.type === 'unavailable-id' && ++tries < 20) { peer.destroy(); modal(`<h3>部屋 ${sv.net.room} を開き直しています…（${tries}回目）</h3><p class="note">前の部屋が閉じるのを待っています</p>`, []); setTimeout(open, 3000); } });
    peer.on('connection', hostConn);
  });
  open();
}
function startGame() {
  setup(); resize(); renderAll(); renderLog();
  log(`始まり：最初の波まで${FIRST_WAIT}秒。手札のタイルを置いて迷路を作ろう`);
  G.started = true; announce('電脳都市', COURSES[COURSE].name);
}
// コースの小さな盤の図：入口（桃）・出口（白）・じゃまなマス（灰）・速くなるマス（黄）・回復するマス（緑）
function courseMini(i) {
  const c = COURSES[i], r = 7, w = Math.sqrt(3) * r, cv0 = document.createElement('canvas');
  cv0.width = Math.ceil(w * (COLS + .5)) + 2; cv0.height = Math.ceil(r * 1.5 * (ROWS - 1) + 2 * r) + 2;
  const g = cv0.getContext('2d'), has = (list, x, y) => (list || []).some(([a, b]) => a === x && b === y);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const cx = 1 + w * (x + .5 + (y & 1) * .5), cy = 1 + r + y * r * 1.5;
    g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); g.lineTo(cx + r * .92 * Math.cos(a), cy + r * .92 * Math.sin(a)); } g.closePath();
    const col = has(c.entrances, x, y) ? '#ff4dff' : c.exit[0] === x && c.exit[1] === y ? '#ffffff' : has(c.block, x, y) ? '#55607e' : has(c.fast, x, y) ? '#c9a83a' : has(c.heal, x, y) ? '#3a9a5a' : null;
    g.fillStyle = col || '#13203f'; g.fill(); g.strokeStyle = '#2a3a66'; g.lineWidth = 1; g.stroke();
  }
  return cv0.toDataURL();
}
// 始める前の画面：人数とコースを選ぶ
// 始める前の画面：タイトル → ルールを選ぶ → コースを選ぶ → 開始（ひとりで遊ぶ・部屋を作る）
function showStart() {
  let n = NPLAYERS, mode = 'solo', nlSet = PARAMS.has('limit');
  // 持ち時間の初めの選び方：ひとりで遊ぶなら制限なし、部屋を作る（通信）なら制限あり（ユーザー）。自分で選んだらそのまま
  const pickMode = m => { mode = m; if (!nlSet) NO_LIMIT = m === 'solo'; rules(); };
  // 1. タイトル：遊び方を選ぶ
  const title = () => {
    const sv = loadSave(), ns = loadNetSave();
    const cont = [];
    if (ns && ns.role === 'client') cont.push([`部屋 ${ns.room} に戻る（席${ns.seat + 1}）`, () => joinRoom(ns.room, ns.name, ns)]);
    if (sv) cont.push([sv.net ? `部屋 ${sv.net.room} を開き直す（${sv.g.wave ? `波${sv.g.wave}のあと` : '最初の波の前'}）` : `続きから（${sv.g.wave ? `波${sv.g.wave}のあと` : '最初の波の前'}・${sv.n}人・${COURSES[sv.course].name}）`, () => sv.net ? reopenHost(sv) : resumeGame(sv)]);
    modal(`<div style="text-align:center;padding:10px 0 4px"><div style="font-size:40px;font-weight:900;color:#fff;letter-spacing:4px;text-shadow:0 0 18px #33f0ff,0 0 6px #33f0ff">電脳都市</div>
      <div style="color:#7cf9ff;font-weight:bold;margin-top:6px">迷路で守って、株で勝つ</div></div>
      <p class="note" style="text-align:center">タイルで迷路を作り、ウイルスの波を全員で${WAVES}回守りきる。タイルのかたまりは会社になり、倒した数で株価が上がる。いちばんお金持ちになった人の勝ち。</p>`,
      [...cont, ['ひとりで遊ぶ（CPUと）', () => pickMode('solo')], ['部屋を作る', () => pickMode('host')], ['部屋に入る', () => showJoin('')],
       ['ルールを読む', () => { showRules(); document.querySelector('#mbox .row button').onclick = () => { document.getElementById('modal').style.display = 'none'; title(); }; }]]);
    document.querySelectorAll('#mbox .row button').forEach(b => { b.style.width = '100%'; });   // 縦に並べる
  };
  // 2. ルールを選ぶ：1項目1行
  const line = (label, items, attr, cur) => `<div style="display:flex;align-items:center;gap:6px;margin:7px 0"><span style="width:5.4em;flex:none;color:#7cf9ff;font-weight:bold;font-size:13px">${label}</span><div class="pick" style="margin:0;gap:4px;flex-wrap:nowrap">${items.map(([k, t]) => `<button class="btn${k === cur ? ' on' : ''}" data-${attr}="${k}" style="padding:5px 7px;font-size:13px;white-space:nowrap">${t}</button>`).join('')}</div></div>`;
  const rules = () => {
    modal(`<h3>${mode === 'host' ? '部屋を作る' : 'ひとりで遊ぶ'}：ルールを選ぶ</h3>` +
      line('人数', [2, 3, 4, 5, 6].map(k => [k, k + '人']), 'n', n) +
      line('難しさ', Object.entries(DIFFS).map(([k, d]) => [k, d.name]), 'df', DIFF) +
      line('持ち時間', [[0, 'あり'], [1, '制限なし']], 'nl', NO_LIMIT ? 1 : 0) +
      line('CPU の強さ', [['strong', 'つよい'], ['normal', 'ふつう'], ['easy', 'よわい']], 'lv', CPU_LEVEL) +
      line('会社の能力', [[1, 'あり'], [0, 'なし']], 'pw', POWERS ? 1 : 0) +
      `<p class="note">${mode === 'host' ? '人数は、ほかの人と CPU を合わせた数。空いた席は CPU が入る。' : '人数は、あなたと CPU を合わせた数。'}</p>`,
      [['次へ（コースを選ぶ）', courses], ['戻る', title]]);
    const on = (a, f) => document.querySelectorAll(`#mbox [data-${a}]`).forEach(b => b.onclick = () => { f(b.dataset[a]); rules(); });
    on('n', v => n = +v); on('df', v => DIFF = v); on('nl', v => { NO_LIMIT = v === '1'; nlSet = true; }); on('lv', v => CPU_LEVEL = v); on('pw', v => POWERS = v === '1');
  };
  // 3. コースを選ぶ：小さな盤の図つきの札
  const courses = () => {
    modal(`<h3>コースを選ぶ</h3>` + COURSES.map((c, i) => `<button class="btn${i === COURSE ? ' on' : ''}" data-c="${i}" style="display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:5px 0;padding:6px">
        <img src="${courseMini(i)}" alt="" style="width:72px;flex:none"><span><b style="color:#7cf9ff">${c.name}</b><br><span class="note" style="color:var(--text)">${c.note}。</span></span></button>`).join('') +
      `<div class="note" style="font-size:11px"><span style="color:#ff4dff">■</span>入口 <span style="color:#fff">■</span>出口 <span style="color:#8a94b4">■</span>置けない <span style="color:#e0bc40">■</span>敵が速くなる <span style="color:#4cc070">■</span>敵が回復する</div>`,
      [[mode === 'host' ? '部屋を作る' : '始める', () => {
        if (mode === 'host') { let nm = ''; try { nm = localStorage.getItem('stock-defense-name') || ''; } catch (e) {} hostLobby(n, nm || 'ホスト'); }
        else { clearSave(); clearNetSave(); NPLAYERS = n; startGame(); } }], ['戻る', rules]]);
    document.querySelectorAll('#mbox [data-c]').forEach(b => b.onclick = () => { useCourse(+b.dataset.c); G.dist = distanceField(); courses(); });
  };
  title();
}
useCourse(COURSE); resize(); G.dist = distanceField();
if (AUTO || PARAMS.has('start')) startGame(); else if (PARAMS.has('room')) showJoin(PARAMS.get('room')); else showStart();
requestAnimationFrame(loop);
window.__G = G;
</script>
